<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/main.css">
    <title>Simple Quiz</title>
</head>
<body>
    <h1>Simple Quiz</h1>
    
    <div id="quiz-container">
        <!-- Hier zullen de vragen worden ingeladen -->
    </div>
    
    <button id="submit-button" class="submit-button">Klaar!</button>
    
    <div id="results" class="results hidden">
        <h2>Resultaat</h2>
        <p>Score: <span id="score"></span><!-- Hier zal de eindscore worden ingeladen --> out of 15</p>
    </div>

    <script src="js/questions.js"></script>
    <script src="js/quiz.js"></script>
</body>
</html>
